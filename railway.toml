[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/entrypoint.sh"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[[services]]
name = "web"
service_type = "web"

[[services.ports]]
port = 80
handlers = ["http"]
force_public = true

[[services.env_vars]]
key = "PORT"
value = "80"

[[services.env_vars]]
key = "APP_ENV"
value = "production"

[[services.env_vars]]
key = "APP_DEBUG"
value = "false"

[[services.env_vars]]
key = "APP_KEY"
value = "base64:cO1b6jYgqE8uPlXvR2h7K9zNxLmQ4wTpvBaSsDdFfGg="

[[services.env_vars]]
key = "DB_CONNECTION"
value = "mysql"

[[services.env_vars]]
key = "DB_HOST"
value = "${{MySQL.MYSQLHOST}}"

[[services.env_vars]]
key = "DB_PORT"
value = "${{MySQL.MYSQLPORT}}"

[[services.env_vars]]
key = "DB_DATABASE"
value = "${{MySQL.MYSQLDATABASE}}"

[[services.env_vars]]
key = "DB_USERNAME"
value = "${{MySQL.MYSQLUSER}}"

[[services.env_vars]]
key = "DB_PASSWORD"
value = "${{MySQL.MYSQLPASSWORD}}"

