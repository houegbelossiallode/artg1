<div id="candidature-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4">
    <div class="relative w-full max-w-2xl bg-[#FAF7F2] rounded-none p-8 sm:p-10 shadow-2xl overflow-y-auto max-h-[90vh] animate-in fade-in zoom-in-95 duration-200">
        <!-- Close Button -->
        <button onclick="document.getElementById('candidature-modal').classList.add('hidden')" class="absolute top-4 right-4 p-2 bg-[#F4EFE6] hover:bg-[#D4A373] text-[#2C221E] hover:text-white transition-colors rounded-none" aria-label="Fermer">
            <svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center gap-1.5 px-3 py-1 bg-[#F4EFE6] border border-[#D4A373]/20 text-[#C85A32] text-[10px] sm:text-xs font-bold uppercase tracking-wider rounded-none mb-4">
                <svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path>
                </svg>
                <span>Tremplin Jeunes Talents</span>
            </div>
            <h2 class="font-serif-title text-3xl sm:text-4xl font-bold text-[#2C221E]">Postuler au Programme de Promotion</h2>
            <p class="text-sm text-[#6B574F] mt-2 font-sans">Réservé aux jeunes créateurs de 15 à 25 ans (Studio &amp; Scènes offerts).</p>
        </div>

        <form class="space-y-6" onsubmit="event.preventDefault(); alert('Candidature soumise avec succès !'); document.getElementById('candidature-modal').classList.add('hidden');">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-[#2C221E] uppercase tracking-wider">Nom &amp; Prénom <span class="text-[#C85A32]">*</span></label>
                    <input required type="text" placeholder="e.g. Samuel Nguema" class="w-full bg-white border border-[#D4A373]/40 p-3 text-sm text-[#2C221E] focus:outline-none focus:border-[#C85A32] focus:ring-1 focus:ring-[#C85A32] rounded-none transition-colors placeholder-[#8C766B]/50" />
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-[#2C221E] uppercase tracking-wider">Nom de Scène / Pseudo</label>
                    <input type="text" placeholder="e.g. Sam Kora" class="w-full bg-white border border-[#D4A373]/40 p-3 text-sm text-[#2C221E] focus:outline-none focus:border-[#C85A32] focus:ring-1 focus:ring-[#C85A32] rounded-none transition-colors placeholder-[#8C766B]/50" />
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-[#2C221E] uppercase tracking-wider">Âge (15 – 25 ans) <span class="text-[#C85A32]">*</span></label>
                    <input required type="number" min="15" max="25" placeholder="21" class="w-full bg-white border border-[#D4A373]/40 p-3 text-sm text-[#2C221E] focus:outline-none focus:border-[#C85A32] focus:ring-1 focus:ring-[#C85A32] rounded-none transition-colors placeholder-[#8C766B]/50" />
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-[#2C221E] uppercase tracking-wider">Discipline <span class="text-[#C85A32]">*</span></label>
                    <div class="relative">
                        <select required class="w-full appearance-none bg-white border border-[#D4A373]/40 p-3 pr-10 text-sm text-[#2C221E] focus:outline-none focus:border-[#C85A32] focus:ring-1 focus:ring-[#C85A32] rounded-none transition-colors">
                            <option value="">Sélectionnez une discipline...</option>
                            <option value="Chant & Polyphonie">Chant & Polyphonie</option>
                            <option value="Percussions & Balafon">Percussions & Balafon</option>
                            <option value="Instruments à Cordes (Kora, etc.)">Instruments à Cordes (Kora, etc.)</option>
                            <option value="Création Numérique Audio">Création Numérique Audio</option>
                            <option value="Autre">Autre</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-[#C85A32]">
                            <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-[#2C221E] uppercase tracking-wider">Lien Audio / Vidéo Démo (Youtube, Soundcloud, Drive) <span class="text-[#C85A32]">*</span></label>
                <input required type="url" placeholder="https://youtube.com/watch?v=..." class="w-full bg-white border border-[#D4A373]/40 p-3 text-sm text-[#2C221E] focus:outline-none focus:border-[#C85A32] focus:ring-1 focus:ring-[#C85A32] rounded-none transition-colors placeholder-[#8C766B]/50" />
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-[#2C221E] uppercase tracking-wider">Présentation de votre projet artistique <span class="text-[#C85A32]">*</span></label>
                <textarea required rows="4" placeholder="Racontez-nous votre parcours, vos influences et ce que vous attendez de l'association..." class="w-full bg-white border border-[#D4A373]/40 p-3 text-sm text-[#2C221E] focus:outline-none focus:border-[#C85A32] focus:ring-1 focus:ring-[#C85A32] rounded-none transition-colors placeholder-[#8C766B]/50 resize-y"></textarea>
            </div>

            <button type="submit" class="w-full px-6 py-3.5 bg-[#C85A32] hover:bg-[#A84223] text-white font-bold text-sm tracking-wide uppercase shadow-lg transition-transform hover:-translate-y-0.5 rounded-none flex items-center justify-center gap-2">
                <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
                <span>Soumettre ma Candidature</span>
            </button>
        </form>
    </div>
</div>
